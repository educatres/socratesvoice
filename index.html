<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="以語音與蘇格拉底式 AI 對話的純前端工具" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://api.openai.com https://api.x.ai https://generativelanguage.googleapis.com https://air.cgu.edu.tw; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" />
    <title>Socrates Voice AI｜蘇格拉底語音 AI</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SOCRATES VOICE AI</p>
          <h1>蘇格拉底語音對話</h1>
        </div>
        <button class="icon-button" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" title="開啟設定">⚙<span class="sr-only">開啟設定</span></button>
      </header>

      <main>
        <section class="settings-panel" id="settings-panel" hidden aria-label="API 與語音設定">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">SETTINGS</p>
              <h2>連接你的 AI</h2>
            </div>
            <button class="icon-button subtle" id="settings-close" type="button" title="關閉設定">×<span class="sr-only">關閉設定</span></button>
          </div>

          <div class="settings-grid">
            <label class="field">
              <span>AI 服務</span>
              <select id="provider-select"></select>
            </label>
            <label class="field field-wide">
              <span>API Key</span>
              <div class="key-row">
                <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="貼上你的 API Key" />
                <button class="small-button" id="toggle-key" type="button">顯示</button>
                <button class="small-button danger" id="clear-key" type="button">清除</button>
              </div>
              <small id="key-hint">金鑰只會送到你選定的服務。請設定 API 限制與配額。</small>
              <small><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">申請 Google AI Studio API Key</a></small>
            </label>
            <label class="check-row field-wide"><input id="remember-key" type="checkbox" /> <span>在此瀏覽器保存此 Provider 的 Key（預設關閉）</span></label>
            <label class="field field-wide">
              <span>API Base URL（可自訂相容 endpoint）</span>
              <input id="base-url" type="url" spellcheck="false" />
            </label>
            <label class="field">
              <span>模型 ID</span>
              <input id="model-id" type="text" spellcheck="false" placeholder="例如 gemini-flash-lite-latest" />
            </label>
            <label class="field">
              <span>推理程度（CGU）</span>
              <select id="reasoning-effort"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select>
            </label>
          </div>
          <p class="provider-hint" id="provider-hint"></p>
          <div class="settings-actions">
            <button class="button secondary" id="test-provider" type="button">測試 Key 並讀取模型</button>
            <button class="button secondary" id="test-connection" type="button">測試模型連線</button>
          </div>
          <div class="model-results" id="model-results" aria-live="polite"></div>
          <p class="privacy-note">本頁是純前端網站，不會把 Key 寫入 URL、Git 或 console。只有勾選保存時才會放入瀏覽器 sessionStorage；清除瀏覽器資料即可移除。</p>
        </section>

        <section class="hero" aria-labelledby="status-label">
          <div class="avatar-stage" id="avatar-stage" data-state="idle">
            <div class="avatar-glow"></div>
            <div class="socrates" aria-label="蘇格拉底卡通頭像" role="img">
              <div class="laurel laurel-left"></div><div class="laurel laurel-right"></div>
              <div class="head"><div class="hair"></div><div class="brow brow-left"></div><div class="brow brow-right"></div><div class="eye eye-left"></div><div class="eye eye-right"></div><div class="nose"></div><div class="beard"></div><div class="mouth"></div></div>
              <div class="shoulders"></div>
            </div>
            <div class="avatar-caption" id="avatar-caption">待命</div>
          </div>
          <div class="status-line"><span class="status-dot" id="status-dot"></span><span id="status-label">待命</span></div>
          <p class="status-detail" id="status-detail">輸入 API Key 後，按住或點一下開始說話。</p>
        </section>

        <section class="conversation" aria-label="對話內容">
          <div class="transcript-card">
            <div class="card-heading"><h2>你說</h2><span id="interim-label">尚未開始</span></div>
            <p class="interim-text" id="interim-text">點擊開始後，辨識中的文字會出現在這裡。</p>
            <label class="manual-input"><span class="sr-only">手動輸入訊息</span><textarea id="manual-input" rows="2" maxlength="2000" placeholder="也可以直接輸入文字…"></textarea></label>
            <div class="manual-actions"><button class="small-button" id="send-manual" type="button">送出文字</button></div>
          </div>
          <div class="conversation-list" id="conversation-list" aria-live="polite"></div>
        </section>

        <section class="controls" aria-label="語音控制">
          <div class="primary-controls">
            <button class="start-button" id="start-button" type="button"><span class="mic-icon">●</span><span id="start-label">開始說話</span></button>
            <button class="button secondary" id="stop-button" type="button" disabled>停止</button>
          </div>
          <div class="secondary-controls">
            <button class="small-button" id="stop-speaking" type="button">停止朗讀</button>
            <button class="small-button" id="replay-speaking" type="button" hidden>重新朗讀</button>
            <button class="small-button" id="retry-button" type="button" hidden>重試</button>
            <button class="small-button danger" id="clear-conversation" type="button">清除對話</button>
          </div>
        </section>

        <section class="voice-settings" aria-label="語音選項">
          <label class="field"><span>語言</span><select id="language"><option value="zh-TW">繁體中文（台灣）</option><option value="en-US">English（US）</option></select></label>
          <label class="field"><span>朗讀聲音</span><select id="voice-select"><option value="">系統預設</option></select></label>
          <label class="field rate-field"><span>朗讀速度 <output id="rate-value">0.9</output></span><input id="speech-rate" type="range" min="0.7" max="1.2" step="0.1" value="0.9" /></label>
          <label class="field"><span>對話模式</span><select id="conversation-mode"><option value="socratic">蘇格拉底引導</option><option value="general">一般對話</option></select></label>
        </section>

        <aside class="consent" id="consent" hidden>
          <strong>開始前請確認</strong>
          <p>你的語音辨識文字與對話內容會送到所選的模型服務；瀏覽器的語音辨識也可能使用 Apple 或瀏覽器的遠端服務。本頁不主動錄音或保存音訊。</p>
          <button class="button" id="consent-accept" type="button">我了解，開始使用</button>
        </aside>
      </main>

      <footer><span>純前端・API Key 由你自行管理</span><a href="./Socrates_Voice_AI_Spec.md" target="_blank" rel="noreferrer">開發規格</a></footer>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
